<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>

  <rect x="40" y="26" width="6" height="26" fill="#7e6f98"/>
  <text x="60" y="47" font-size="22" font-weight="bold" fill="#222838">H3-VR をヘルメットに付ける — 3つの部品でつなぐ</text>
  <text x="60" y="72" font-size="13" fill="#595f6e">下から順に組む。要は「フォークとフィンガーをかみ合わせてネジ留め → 出てきた突起ネジに H3-VR をねじ込む」だけ。</text>

  <!-- ============ 左：分解図 ============ -->
  <text x="60" y="112" font-size="15" font-weight="bold" fill="#222838">分解して見たところ</text>

  <!-- H3-VR -->
  <g>
    <path d="M 232 140 L 288 140 L 300 236 L 220 236 Z" fill="#3a4155"/>
    <circle cx="248" cy="163" r="4.5" fill="#c9cbd2"/>
    <circle cx="272" cy="163" r="4.5" fill="#c9cbd2"/>
    <circle cx="256" cy="180" r="4.5" fill="#c9cbd2"/>
    <circle cx="278" cy="180" r="4.5" fill="#c9cbd2"/>
    <rect x="238" y="196" width="44" height="20" rx="2" fill="#e0a526"/>
    <text x="440" y="176" font-size="14" font-weight="bold" fill="#222838">① Zoom H3-VR</text>
    <text x="440" y="196" font-size="11.5" fill="#595f6e">底面に 1/4インチの<tspan font-weight="bold" fill="#c0392b">ネジ穴（メス）</tspan>がある</text>
    <text x="440" y="214" font-size="11.5" fill="#595f6e">166g（電池込み）／高さ123mm</text>
    <path d="M 320 190 L 425 185" stroke="#8a8f9a" stroke-width="1"/>
    <!-- ねじ穴 -->
    <rect x="250" y="236" width="20" height="9" fill="#1e222c"/>
    <text x="196" y="252" font-size="10" fill="#8a8f9a" text-anchor="end">ネジ穴</text>
    <path d="M 200 248 L 246 242" stroke="#c9cbd2" stroke-width="0.8"/>
  </g>

  <!-- 組む向きの矢印 -->
  <path d="M 260 258 L 260 276" stroke="#c0392b" stroke-width="2"/>
  <path d="M 254 268 L 260 280 L 266 268 Z" fill="#c0392b"/>

  <!-- 変換アダプター -->
  <g>
    <rect x="248" y="300" width="24" height="16" fill="#c0392b"/>
    <text x="196" y="312" font-size="10" fill="#c0392b" text-anchor="end" font-weight="bold">突起ネジ（オス）</text>
    <path d="M 200 308 L 244 308" stroke="#c9cbd2" stroke-width="0.8"/>
    <rect x="216" y="316" width="88" height="26" rx="3" fill="#7e6f98"/>
    <rect x="224" y="342" width="12" height="26" fill="#7e6f98"/>
    <rect x="254" y="342" width="12" height="26" fill="#7e6f98"/>
    <rect x="284" y="342" width="12" height="26" fill="#7e6f98"/>
    <text x="440" y="322" font-size="14" font-weight="bold" fill="#222838">② 変換アダプター</text>
    <text x="440" y="342" font-size="11.5" fill="#595f6e">上に<tspan font-weight="bold" fill="#c0392b">突起ネジ</tspan>、下に<tspan font-weight="bold">3枚のフィンガー</tspan></text>
    <text x="440" y="360" font-size="11.5" fill="#595f6e">エツミ E-2489 ／ レックマウント GP-CN-KD</text>
    <path d="M 320 336 L 425 332" stroke="#8a8f9a" stroke-width="1"/>
  </g>

  <path d="M 260 380 L 260 398" stroke="#c0392b" stroke-width="2"/>
  <path d="M 254 390 L 260 402 L 266 390 Z" fill="#c0392b"/>

  <!-- GVHS30 -->
  <g>
    <rect x="230" y="416" width="12" height="30" fill="#2e7d5b"/>
    <rect x="278" y="416" width="12" height="30" fill="#2e7d5b"/>
    <rect x="212" y="446" width="96" height="20" rx="3" fill="#2e7d5b"/>
    <rect x="232" y="452" width="10" height="8" fill="#ffffff"/>
    <rect x="278" y="452" width="10" height="8" fill="#ffffff"/>
    <text x="440" y="432" font-size="14" font-weight="bold" fill="#222838">③ ベンテッドヘルメットマウント</text>
    <text x="440" y="452" font-size="11.5" fill="#595f6e">上に<tspan font-weight="bold">2枚のフォーク</tspan>、土台に<tspan font-weight="bold">ストラップ穴</tspan></text>
    <text x="440" y="470" font-size="11.5" fill="#595f6e">GoPro GVHS30 ／ レックマウント REC-B50（積載200gまで）</text>
    <path d="M 320 442 L 425 442" stroke="#8a8f9a" stroke-width="1"/>
  </g>

  <path d="M 260 478 L 260 496" stroke="#c0392b" stroke-width="2"/>
  <path d="M 254 488 L 260 500 L 266 488 Z" fill="#c0392b"/>

  <!-- ヘルメット -->
  <g>
    <path d="M 150 570 A 110 82 0 0 1 370 570 Z" fill="#e9ebee" stroke="#8a8f9a" stroke-width="1.4"/>
    <rect x="222" y="512" width="34" height="9" rx="4" fill="#ffffff" stroke="#8a8f9a" stroke-width="1"/>
    <rect x="266" y="512" width="34" height="9" rx="4" fill="#ffffff" stroke="#8a8f9a" stroke-width="1"/>
    <path d="M 226 516 C 240 534 282 534 296 516" fill="none" stroke="#2e7d5b" stroke-width="3.4"/>
    <text x="440" y="528" font-size="14" font-weight="bold" fill="#222838">④ ヘルメット</text>
    <text x="440" y="548" font-size="11.5" fill="#595f6e"><tspan font-weight="bold" fill="#c0392b">細長い通気孔が2本以上、前後に平行</tspan>に並んでいること</text>
    <text x="440" y="566" font-size="11.5" fill="#595f6e">緑＝その2本の穴に通して締めるストラップ</text>
    <path d="M 384 540 L 425 538" stroke="#8a8f9a" stroke-width="1"/>
  </g>

  <!-- ============ 右下：組み立て後 ============ -->
  <rect x="600" y="392" width="320" height="196" fill="#f5f3f9"/>
  <text x="620" y="418" font-size="14" font-weight="bold" fill="#7e6f98">組み上がるとこうなる</text>

  <path d="M 668 560 A 92 68 0 0 1 852 560 Z" fill="#e9ebee" stroke="#8a8f9a" stroke-width="1.2"/>
  <rect x="726" y="500" width="68" height="16" rx="3" fill="#2e7d5b"/>
  <rect x="736" y="474" width="48" height="26" rx="2" fill="#7e6f98"/>
  <path d="M 742 474 L 778 474 L 786 396 L 734 396 Z" fill="#3a4155"/>
  <circle cx="752" cy="414" r="3.4" fill="#c9cbd2"/>
  <circle cx="768" cy="414" r="3.4" fill="#c9cbd2"/>
  <circle cx="760" cy="428" r="3.4" fill="#c9cbd2"/>
  <text x="700" y="580" font-size="10.5" fill="#595f6e" text-anchor="middle">横倒し（エンドファイア）なら高さ78mm</text>

  <!-- ============ 注意 ============ -->
  <rect x="600" y="112" width="320" height="256" fill="#fdf7e8"/>
  <text x="620" y="138" font-size="14" font-weight="bold" fill="#222838">買う前に確かめる3点</text>
  <text x="620" y="168" font-size="12" font-weight="bold" fill="#c0392b">1. アダプターのネジが「突起」か</text>
  <text x="620" y="188" font-size="11" fill="#595f6e">逆向き（1/4が穴）の製品が大量にある。</text>
  <text x="620" y="206" font-size="11" fill="#595f6e">商品写真でネジが飛び出しているか見る。</text>
  <text x="620" y="236" font-size="12" font-weight="bold" fill="#c0392b">2. ヘルメットの通気孔</text>
  <text x="620" y="256" font-size="11" fill="#595f6e">真上からの写真で、細長い穴が2本以上</text>
  <text x="620" y="274" font-size="11" fill="#595f6e">前後に並んでいるか。丸い点々では通らない。</text>
  <text x="620" y="304" font-size="12" font-weight="bold" fill="#c0392b">3. H3-VR底面のネジ穴</text>
  <text x="620" y="324" font-size="11" fill="#595f6e">公式資料で確認できなかった。三脚マウント</text>
  <text x="620" y="342" font-size="11" fill="#595f6e">経由かもしれない。販売店に聞く。</text>

  <text x="60" y="604" font-size="10.5" fill="#8a8f9a">※ 形は模式図。実物の比率とは異なる（2026-09-05）</text>
</svg>
